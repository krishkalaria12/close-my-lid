name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# This job packages a universal binary on a macOS runner, which bills at ten
# times the Linux rate. A superseded push does not need to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Every step below compiles the same workspace three times over — debug
      # tests, then both Apple targets for the package — so the dependency
      # tree is the single biggest thing worth not rebuilding each run.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop

      # The menu bar app talks to AppKit through objc2, so Command Line Tools
      # are enough — there is no Metal shader compiler in the build and
      # therefore no need to select full Xcode.
      - name: Test the macOS app
        working-directory: apps/desktop
        run: |
          cargo test -p lidcore -p lid-macos
          cargo clippy -p lidcore -p lid-macos --all-targets -- -D warnings

      - name: Smoke test the bundled executable
        working-directory: apps/desktop
        run: |
          cargo build -p lid-macos
          ./target/debug/CloseMyLid --version
          ./target/debug/CloseMyLid status

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # The site deploys to Cloudflare straight from this repository, and
      # nothing here ever type-checked or built it: a broken page reached
      # production before anything in CI had an opinion. `astro check` runs as
      # part of the build script.
      - name: Build the website
        run: pnpm --filter @close-my-lid/web build

      # npm, not pnpm: `ray lint` validates that the extension directory holds
      # its own `package-lock.json`, and pnpm keeps one lockfile at the
      # workspace root. `packages/raycast` is excluded from the pnpm workspace
      # for that reason — see `pnpm-workspace.yaml`.
      - name: Install Raycast dependencies
        working-directory: packages/raycast
        run: npm ci

      - name: Validate Raycast extension
        working-directory: packages/raycast
        run: |
          npm run lint
          npm run build
          npx tsc --noEmit

      - name: Validate Homebrew formula
        run: |
          ruby -c Formula/close-my-lid.rb
          ruby -c Casks/close-my-lid.rb
          brew style Formula/close-my-lid.rb
          brew style Casks/close-my-lid.rb
          ruby scripts/update-homebrew-tap-test.rb
          ruby scripts/validate-release-instructions-test.rb
          ruby scripts/validate-release-instructions.rb

      # Added from inside the workspace, because `apps/desktop/rust-toolchain.toml`
      # pins the toolchain. Run from the repository root this installs the
      # targets into the *default* toolchain instead, and the packaging build —
      # which runs under the pinned one — then fails with "can't find crate for
      # `std`" for a target rustup has just reported adding successfully.
      - name: Install the Apple targets
        working-directory: apps/desktop
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustup target list --installed

      - name: Package macOS app
        run: |
          ./scripts/package-macos-app.sh
          plutil -lint "dist/macos/Close My Lid.app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' 'dist/macos/Close My Lid.app/Contents/Info.plist')" = "true"
          # Both Macs, from one archive.
          lipo -archs "dist/macos/Close My Lid.app/Contents/MacOS/CloseMyLid" | grep -F 'arm64'
          lipo -archs "dist/macos/Close My Lid.app/Contents/MacOS/CloseMyLid" | grep -F 'x86_64'
          # A menu bar app that drags in a framework has regressed: the bundle
          # is meant to be one self-contained executable plus its icon.
          test ! -d "dist/macos/Close My Lid.app/Contents/Frameworks"
          codesign --verify --deep --strict --verbose=2 "dist/macos/Close My Lid.app"
          ruby scripts/validate-appcast.rb
