name: ci-desktop

on:
  push:
    branches: [main]
    paths: ["apps/desktop/**", ".github/workflows/ci-desktop.yml"]
  pull_request:
    paths: ["apps/desktop/**", ".github/workflows/ci-desktop.yml"]
  workflow_dispatch:

# A push that supersedes an earlier one does not need the earlier one's matrix
# finished: this is nine jobs across three operating systems.
concurrency:
  group: ci-desktop-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/desktop

jobs:
  core:
    # lidcore is platform-agnostic, so it is tested on every platform it
    # ships a backend for.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop

      - name: Test lidcore
        run: cargo test -p lidcore

      - name: Lint lidcore
        run: cargo clippy -p lidcore -- -D warnings

  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop

      - name: Test and lint the CLI
        run: |
          cargo test -p lid-cli
          cargo clippy -p lid-cli --all-targets -- -D warnings

      - name: Smoke test the CLI
        # `agents` and `--help` need no privileges, unlike enable/disable.
        run: |
          cargo run -p lid-cli -- --version
          cargo run -p lid-cli -- agents --json

      - name: Print the systemd unit
        if: runner.os == 'Linux'
        run: cargo run -p lid-cli -- systemd

  gui:
    # Windows only: the tray app is not shipped on Linux, where stock GNOME
    # has no tray and Wayland will not anchor a panel to one. macOS has its own
    # AppKit app in `lid-macos`, covered by `ci.yml`.
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop

      - name: Build and lint the tray app
        run: |
          cargo build -p lid-gui
          cargo clippy -p lid-gui --all-targets -- -D warnings

  menu-bar:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop

      - name: Build and test the menu bar app
        run: |
          cargo test -p lid-macos
          cargo clippy -p lid-macos --all-targets -- -D warnings

  format:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check formatting
        run: cargo fmt --all -- --check
