[package]
name = "lidcore"
description = "Platform-agnostic core for Close My Lid: hold state machine, persistence, agent detection, and per-OS lid power backends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
directories.workspace = true
tracing.workspace = true
starship-battery.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
# The Power* scheme APIs live behind Win32_System_Registry because they take
# an HKEY root. LocalFree, which releases the GUID PowerGetActiveScheme
# allocates, lives in Win32_Foundation.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Power",
    "Win32_System_Registry",
] }
