[package]
name = "lidcore"
description = "Platform-agnostic core for Close My Lid: hold state machine, persistence, agent detection, and per-OS lid power backends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
directories.workspace = true
tracing.workspace = true
starship-battery.workspace = true
tempfile.workspace = true

# macOS takes its own snapshot through libproc; see `agents::darwin`.
[target.'cfg(not(target_os = "macos"))'.dependencies]
sysinfo.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
# The Power* scheme APIs live behind Win32_System_Registry because they take
# an HKEY root. LocalFree, which releases the GUID PowerGetActiveScheme
# allocates, lives in Win32_Foundation.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Power",
    "Win32_System_Registry",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# The process scan and the notification plan both go through libproc/sysctl
# directly; see `agents::darwin` for why `sysinfo` is not used there.
libc.workspace = true
# The closed-lid read goes through IOKit's `IOPMCopySystemPowerSettings`
# rather than forking `pmset -g` every reconciliation; see `power::macos`.
objc2-core-foundation.workspace = true
# Update discovery parses the appcast; the watchdog agent writes a plist.
plist.workspace = true
roxmltree.workspace = true
semver.workspace = true
