[package]
name = "lid-gui"
description = "Close My Lid tray app for Windows, built on adabraka-gpui."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "close-my-lid-gui"
path = "src/main.rs"

[dependencies]
lidcore.workspace = true
thiserror.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Pinned exactly on purpose: gpui is pre-1.0 and breaks between minor
# versions. Upgrade deliberately, never by a floating range.
#
# Windows only. macOS has its own AppKit app in `lid-macos`, and building gpui
# there would need the Metal shader compiler from full Xcode for no benefit.
[target.'cfg(target_os = "windows")'.dependencies]
adabraka-gpui.workspace = true
