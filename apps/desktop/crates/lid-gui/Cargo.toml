[package]
name = "lid-gui"
description = "Close My Lid desktop app for Windows and Linux, built on gpui-kit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "close-my-lid-gui"
path = "src/main.rs"

[dependencies]
lidcore.workspace = true
thiserror.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ureq.workspace = true

# Pinned exactly on purpose: gpui is pre-1.0 and breaks between minor
# versions. Upgrade deliberately, never by a floating range.
#
# The shipped targets are Windows and Linux. It also builds on macOS — gpui-kit
# compiles its Metal shaders at runtime, so no full Xcode is needed — which is
# only for working on the interface from a Mac; the product there is
# `lid-macos`.
gpui-kit.workspace = true

# The system integrations have their own native homes on macOS, so a Mac build
# of this crate stubs them rather than registering a development binary as a
# login item or posting through a second notification path.
[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust.workspace = true
auto-launch.workspace = true
