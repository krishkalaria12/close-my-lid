[workspace]
resolver = "3"
members = ["crates/lidcore"]

[workspace.package]
version = "0.4.4"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/krishkalaria12/close-my-lid"

[workspace.dependencies]
lidcore = { path = "crates/lidcore" }

anyhow = "1.0.104"
thiserror = "2.0.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sysinfo = "0.39.6"
starship-battery = "0.11.1"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"

# Linux: logind inhibitor over the system bus.
zbus = "5.19.0"

# Windows: power scheme (LIDACTION) + execution state.
windows = "0.62.2"

# Windows GUI. Fork of Zed's GPUI that adds tray, notifications and daemon mode.
# Pinned exactly: gpui is pre-1.0 and breaks between minor versions.
adabraka-gpui = "=0.5.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
