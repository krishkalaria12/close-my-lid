[workspace]
resolver = "3"
members = ["crates/lidcore", "crates/lid-cli", "crates/lid-gui", "crates/lid-macos"]

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/krishkalaria12/close-my-lid"

[workspace.dependencies]
lidcore = { path = "crates/lidcore" }

anyhow = "1.0.104"
thiserror = "2.0.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sysinfo = "0.39.6"
starship-battery = "0.11.1"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"

# Version comparison for update discovery. Hand-rolled dotted comparison got
# prereleases backwards: `0.5.0-beta.1` read as newer than `0.5.0`.
semver = "1.0.28"

# Atomic state writes: the app and the once-a-minute watchdog share a
# directory, and a torn `fs::write` reads back as "no session".
tempfile = "3.27.0"

# macOS: `lidcore` takes its process snapshot through libproc and sysctl
# rather than sysinfo, which needs the raw bindings.
libc = "0.2.189"

# macOS: the menu bar app talks to AppKit directly through objc2, so the whole
# product is Rust and needs no Xcode toolchain to build.
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-user-notifications = "0.3.2"
objc2-service-management = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-quartz-core = "0.3.2"
block2 = "0.6.2"

# macOS: GCD, so a blocking read runs on a shared global queue and its answer
# is posted back to the main queue — no thread spawned per reconciliation.
dispatch2 = "0.3.1"

# macOS: stderr from a bundle launched by LaunchServices goes nowhere, so the
# app logs to the unified log where `log stream` and Console can see it.
tracing-oslog = "0.3.0"

# macOS: the watchdog LaunchAgent plist and the appcast, parsed and written by
# libraries rather than by `format!` and `str::find`.
plist = "1.10.1"
roxmltree = "0.21.1"

# Linux: logind inhibitor over the system bus.
zbus = "5.19.0"

# Windows: power scheme (LIDACTION) + execution state.
windows = "0.62.2"

# Windows GUI. Fork of Zed's GPUI that adds tray, notifications and daemon mode.
# Pinned exactly: gpui is pre-1.0 and breaks between minor versions.
adabraka-gpui = "=0.5.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
